<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#204883" />
    <title>Vous êtes hors ligne | TafTech</title>
    <style>
      /* Page autonome : elle s'affiche quand le réseau est coupé, donc rien n'est chargé depuis le site. */
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1e293b; background: #f8fafc; }
      main { max-width: 26rem; padding: 2rem 1.5rem; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.5rem; margin: 1rem 0 .5rem; }
      p { margin: 0 0 1.5rem; line-height: 1.5; color: #475569; }
      button { font: inherit; font-weight: 600; padding: .7rem 1.4rem; border: 0; border-radius: .6rem;
               background: #204883; color: #fff; cursor: pointer; }
      button:focus-visible { outline: 3px solid #82a1d0; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/taftech-icone-192.png" alt="" width="72" height="72" />
      <h1>Vous êtes hors ligne</h1>
      <p>Impossible de joindre TafTech pour le moment. Vérifiez votre connexion internet, puis réessayez.</p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </main>
  </body>
</html>
